# Coqui TTS — GPU (Docker Desktop + WSL2 / NVIDIA Container Toolkit).
#
# Fine-tuning XTTS (Gradio, porta 5003):
#   docker compose --profile finetune up xtts-finetune
#   Windows: docker-finetune.bat   ou   run-docker.bat finetune
#
# Servidor tts-server (porta 5002): docker compose up xtts-server

services:
  xtts-server:
    build: .
    image: coqui-tts:local
    container_name: coqui-xtts-server
    ports:
      - "5002:5002"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - coqui-tts-models:/root/.local/share/tts
      - huggingface-cache:/root/.cache/huggingface
      # Dataset local (somente leitura) — opcional
      - ./data/brPB22_g1bF01_char:/dataset/brPB22:ro
    shm_size: 2gb
    entrypoint: []
    command:
      - tts-server
      - --model_name
      - tts_models/multilingual/multi-dataset/xtts_v2
      - --use_cuda
      - --port
      - "5002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  xtts-finetune:
    profiles: [finetune]
    build: .
    image: coqui-tts:local
    container_name: coqui-xtts-finetune
    ports:
      - "5003:5003"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Evita telemetria Gradio (pedidos HTTP extras nos logs)
      - GRADIO_ANALYTICS_ENABLED=False
    volumes:
      - coqui-tts-models:/root/.local/share/tts
      - huggingface-cache:/root/.cache/huggingface
      - ./data/xtts-work:/data/xtts_ft
      # Áudios + metadata_train/eval gerados por scripts/export_brPB22_xtts_metadata.py
      - ./data/brPB22_g1bF01_char:/dataset/brPB22:ro
      # Código TTS do host (editable install em /app) — evita rebuild após alterar demos/utils
      - ./TTS:/app/TTS
    shm_size: 2gb
    entrypoint: []
    command:
      - python
      - -m
      - TTS.demos.xtts_ft_demo.xtts_demo
      - --port
      - "5003"
      - --out_path
      - /data/xtts_ft
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  coqui-tts-models:
  huggingface-cache:
